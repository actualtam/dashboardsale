version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dashboardsale-db
    restart: always
    environment:
      POSTGRES_USER: billz
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: billz_retail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboardsale-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://billz:secretpassword123@db:5432/billz_retail?schema=public
      - TELEGRAM_BOT_TOKEN=8937516783:AAGX7BJSiBOQxyJXPFlu1lC45htLpLros1g
      - TELEGRAM_CHAT_ID=
    depends_on:
      - db

volumes:
  postgres_data:
